<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="lzBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,1 L10,6 L0,11 Z" fill="#38bdf8"/></marker>
    <marker id="lzGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,1 L10,6 L0,11 Z" fill="#34d399"/></marker>
    <marker id="lzAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,1 L10,6 L0,11 Z" fill="#fbbf24"/></marker>
    <marker id="lzRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,1 L10,6 L0,11 Z" fill="#f87171"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#0a1128"/>
  <text x="64" y="64" fill="#f8fafc" font-size="32" font-weight="700">Landing Zone Archetype Drift Topology: ARG Changes, Deployment Stacks &amp; Teams Bridge</text>
  <text x="64" y="98" fill="#94a3b8" font-size="18">PowerShell 7.4+ Control Plane | Microsoft.Resources/changes | Graph v1.0 Incident Corroboration</text>

  <!-- Zone 1: Landing Zone Hub -->
  <rect x="64" y="148" width="480" height="440" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="92" y="188" fill="#38bdf8" font-size="20" font-weight="700">Azure Landing Zone Hub (198.51.100.0/24)</text>

  <rect x="92" y="218" width="424" height="110" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="112" y="250" fill="#f8fafc" font-size="17" font-weight="600">Deployment Stacks (2024-03-01)</text>
  <text x="112" y="276" fill="#d1fae5" font-size="14">denySettings.mode = denyWriteAndDelete</text>
  <text x="112" y="300" fill="#94a3b8" font-size="13">NSGs, Route Tables, Key Vaults</text>

  <rect x="92" y="348" width="424" height="100" rx="8" fill="#1e293b" stroke="#fbbf24"/>
  <text x="112" y="380" fill="#fbbf24" font-size="17" font-weight="600">Azure Resource Graph (ResourceChanges)</text>
  <text x="112" y="406" fill="#e2e8f0" font-size="14">POST /providers/Microsoft.ResourceGraph/resources</text>
  <text x="112" y="430" fill="#94a3b8" font-size="13">Captures clientType, propertyChanged, callerAppId</text>

  <rect x="92" y="468" width="424" height="96" rx="8" fill="#1e293b" stroke="#64748b"/>
  <text x="112" y="500" fill="#f8fafc" font-size="16" font-weight="600">GitOps OIDC Pipeline (Baseline)</text>
  <text x="112" y="526" fill="#cbd5e1" font-size="14">ApprovedPipelineAppIds -&gt; Fast-Path NONE</text>

  <!-- Zone 2: AI Drift Intent Enclave -->
  <rect x="615" y="148" width="670" height="440" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="643" y="188" fill="#fbbf24" font-size="20" font-weight="700">AI Drift Intent &amp; Provenance Enclave</text>

  <rect x="643" y="218" width="614" height="165" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="665" y="250" fill="#38bdf8" font-size="17" font-weight="700">ai/Invoke-DriftIntentClassifier.ps1</text>
  <text x="665" y="278" fill="#e2e8f0" font-size="14">1. Checks OIDC CallerAppId fast-path</text>
  <text x="665" y="302" fill="#e2e8f0" font-size="14">2. Validates INC-P1-xxxxxx regex &amp; resource name in transcript</text>
  <text x="665" y="326" fill="#e2e8f0" font-size="14">3. Abstains (ABSTAIN_UNCORROBORATED_CLAIM) if Conf &lt; 0.75</text>
  <text x="665" y="352" fill="#94a3b8" font-size="13">Prompt-injection boundary: transcripts isolated as untrusted data</text>

  <rect x="643" y="405" width="295" height="158" rx="8" fill="#1e293b" stroke="#a78bfa"/>
  <text x="663" y="438" fill="#c4b5fd" font-size="16" font-weight="700">Azure AI Foundry</text>
  <text x="663" y="466" fill="#e2e8f0" font-size="13">Semantic intent verification</text>
  <text x="663" y="490" fill="#e2e8f0" font-size="13">temp = 0.0 | JSON object</text>
  <text x="663" y="514" fill="#34d399" font-size="12">Local deterministic fallback</text>

  <rect x="962" y="405" width="295" height="158" rx="8" fill="#1e293b" stroke="#64748b"/>
  <text x="982" y="438" fill="#f8fafc" font-size="16" font-weight="700">LandingZoneDrift.psm1</text>
  <text x="982" y="466" fill="#cbd5e1" font-size="13">Get-ArgResourceChanges</text>
  <text x="982" y="490" fill="#cbd5e1" font-size="13">Test-DeploymentStackDrift</text>
  <text x="982" y="514" fill="#cbd5e1" font-size="13">Confirm-BreakGlassIncidentTag</text>

  <!-- Zone 3: Microsoft Graph v1.0 Incident Bridge -->
  <rect x="1356" y="148" width="500" height="440" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
  <text x="1384" y="188" fill="#a5b4fc" font-size="20" font-weight="700">Microsoft Graph v1.0 Bridge Context</text>
  <rect x="1384" y="218" width="444" height="190" rx="8" fill="#1e293b" stroke="#818cf8"/>
  <text x="1404" y="250" fill="#f8fafc" font-size="17" font-weight="600">Teams P1 Incident Channel</text>
  <text x="1404" y="278" fill="#cbd5e1" font-size="14">GET /v1.0/teams/{id}/channels/{id}/messages</text>
  <text x="1404" y="306" fill="#e2e8f0" font-size="14">Extracts timestamped SRE messages &amp;</text>
  <text x="1404" y="330" fill="#e2e8f0" font-size="14">corroborates INC-P1-xxxxxx + resource</text>
  <text x="1404" y="366" fill="#94a3b8" font-size="13">graph/Get-IncidentBridgeContext.ps1</text>

  <rect x="1384" y="428" width="444" height="136" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="1404" y="460" fill="#34d399" font-size="17" font-weight="700">4-Hour Break-Glass Backport PR</text>
  <text x="1404" y="488" fill="#e2e8f0" font-size="14">OPEN_AUTOMATED_REST_BACKPORT_PR</text>
  <text x="1404" y="514" fill="#cbd5e1" font-size="13">Auto-expires temporary NSG/Route rule at T+4h</text>

  <!-- Bottom: Outcomes & KQL -->
  <rect x="64" y="635" width="880" height="360" rx="14" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
  <text x="92" y="675" fill="#f87171" font-size="20" font-weight="700">Deterministic Reconciliation Outcomes</text>
  <rect x="92" y="706" width="824" height="74" rx="8" fill="#064e3b" fill-opacity="0.35" stroke="#34d399"/>
  <text x="114" y="750" fill="#d1fae5" font-size="16" font-weight="600">AUTHORIZED_P1_HOTFIX_WITH_TTL: Corroborated in Teams -&gt; 4h Backport PR</text>
  <rect x="92" y="796" width="824" height="74" rx="8" fill="#7f1d1d" fill-opacity="0.35" stroke="#f87171"/>
  <text x="114" y="840" fill="#fee2e2" font-size="16" font-weight="600">SHADOW_IT_PORTAL_DRIFT: No P1 Ticket -&gt; REVERT_TO_BASELINE_IMMEDIATELY</text>
  <rect x="92" y="886" width="824" height="74" rx="8" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24"/>
  <text x="114" y="930" fill="#fef3c7" font-size="16" font-weight="600">ABSTAIN_UNCORROBORATED_CLAIM: Ticket Not in Bridge -&gt; SRE Commander Hold</text>

  <rect x="980" y="635" width="876" height="360" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="1008" y="675" fill="#38bdf8" font-size="20" font-weight="700">KQL Telemetry &amp; Pester 6.x Verification</text>
  <rect x="1008" y="708" width="820" height="120" rx="8" fill="#1e293b" stroke="#64748b"/>
  <text x="1030" y="744" fill="#f8fafc" font-size="17" font-weight="600">queries/NSG-SecurityDrift.kql &amp; ResourceGraph-OutOfBandChanges.kql</text>
  <text x="1030" y="774" fill="#cbd5e1" font-size="14">Audits all out-of-band Portal/CLI writes, TTL expirations, and revert actions</text>
  <rect x="1008" y="846" width="820" height="112" rx="8" fill="#1e293b" stroke="#64748b"/>
  <text x="1030" y="882" fill="#f8fafc" font-size="17" font-weight="600">Pester 6.x Contract Suite (tests/LandingZoneDrift.Tests.ps1)</text>
  <text x="1030" y="912" fill="#cbd5e1" font-size="14">13 automated tests covering ARG ResourceChanges, Deployment Stacks, AI Intent &amp; Graph v1.0</text>

